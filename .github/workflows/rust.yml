name: Rust CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # The Solana CLI is deliberately not installed: the test suite generates
    # keypairs in-process via solana-sdk and needs no network, wallet or CLI.
    # The previous step also never added the binary to PATH, so it was doing
    # nothing while adding time to every run.

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        # Cargo.lock is gitignored, so hashing it alone yields an empty string
        # and a key that never changes - the cache would go stale and never
        # refresh. Hash the manifest instead, which is tracked.
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build

    - name: Run tests
      run: cargo test
